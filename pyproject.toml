[project]
name = "flatnotes-mcp"
version = "0.1.0"
description = "MCP server providing multi-instance access to flatnotes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.11",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
flatnotes-mcp = "flatnotes_mcp.server:main"
flatnotes-mcp-check = "flatnotes_mcp.config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatnotes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ISC", "PYI"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
